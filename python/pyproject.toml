[project]
name = "apiverve-superheronamegenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Generate unique superhero names using dynamic templates and word combinations."
keywords = ["superhero name", "comic book", "hero name generator", "vigilante", "superpower"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/superheroname?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/superheroname?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/superheroname-api"
Twitter = "https://twitter.com/apivervehq"
